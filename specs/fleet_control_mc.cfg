\* TLC Model Checking Configuration for fleet_control.tla
\* Fleet control loop concurrency model
\*
\* Checks safety invariants only. Liveness properties (temporal) are
\* documented in the .tla file but require LiveSpec with per-process
\* strong fairness and unbounded time, which TLC cannot tractably verify
\* at this model size. See LiveSpec comment in fleet_control.tla.

SPECIFICATION Spec

\* Constants -- small values to keep state space feasible
\* N=3 instances, M=2 callers per plan 20 section 10.5
CONSTANTS
    Instances = {i1, i2, i3}
    Callers = {c1, c2}
    MaxSessions = 2
    WarmPoolTarget = 1
    UnhealthyThreshold = 2
    MaxTime = 6

\* Safety invariants checked in every reachable state
INVARIANTS
    TypeInvariant
    SafetyInvariant
